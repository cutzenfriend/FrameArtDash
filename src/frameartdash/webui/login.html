<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FrameArtDash · Sign in</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg:#0e1014; --card:#171b21; --line:rgba(235,231,224,.1); --text:#ebe7e0; --muted:#9a958d; --gold:#c9a96e; --bad:#d9826b; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(1200px 600px at 50% -10%, #1b1f27, var(--bg)); color:var(--text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; padding:16px; }
  form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:36px 32px 28px; box-shadow:0 30px 80px rgba(0,0,0,.45); }
  .mark { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
  .mark svg { width:36px; height:36px; }
  h1 { font:500 26px/1.1 "Iowan Old Style","Palatino Linotype",Georgia,serif; margin:0; letter-spacing:.01em; }
  h1 small { display:block; font:12px/1.6 system-ui,sans-serif; color:var(--muted); letter-spacing:.14em; text-transform:uppercase; margin-top:4px; }
  label { display:block; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; margin-bottom:8px; }
  input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:#0f1216; color:var(--text); font:inherit; }
  input:focus { outline:2px solid var(--gold); outline-offset:1px; border-color:transparent; }
  button { width:100%; margin-top:18px; padding:12px; border:0; border-radius:10px; background:var(--gold); color:#16130d; font:600 15px system-ui,sans-serif; cursor:pointer; }
  button:hover { filter:brightness(1.08); }
  .error { color:var(--bad); font-size:14px; margin:14px 0 0; display:none; }
  .error.show { display:block; }
</style>
</head>
<body>
<form method="post" action="/login">
  <div class="mark">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="5" width="28" height="22" rx="2" fill="#0f1216" stroke="#c9a96e" stroke-width="2"/><rect x="7" y="10" width="18" height="12" fill="#c9a96e" opacity=".85"/></svg>
    <h1>FrameArtDash<small>Dashboards as art</small></h1>
  </div>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
  <p class="error" id="error">Wrong password.</p>
  <button type="submit">Sign in</button>
</form>
<script>
  if (new URLSearchParams(location.search).has("error")) document.getElementById("error").classList.add("show");
</script>
</body>
</html>
