services:
  frameartdash:
    image: ghcr.io/cutzenfriend/frameartdash:latest
    container_name: frameartdash
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      TARGET_URL: http://192.168.1.10:8123/frame-dash/art
      HA_TOKEN: ${HA_TOKEN}
      FRAME_HOST: 192.168.1.50
      INTERVAL_MIN: 10
      ACTIVE_HOURS: "06-23"
      STYLE: blur
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
