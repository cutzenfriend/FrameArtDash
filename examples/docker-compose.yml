services:
  frameartdash:
    image: ghcr.io/cutzenfriend/frameartdash:latest
    container_name: frameartdash
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      # Password for the web UI on http://<docker-host>:8080
      ADMIN_PASSWORD: ${FAD_PASSWORD}
    volumes:
      - ./data:/data
    ports:
      - "8080:8080"
